AWSTemplateFormatVersion: "2010-09-09"
Description: HelpDesk Cloud - L3 - Premiere instance EC2 (serveur Node.js minimal, sous-reseau public)

Parameters:
  ProjectName:
    Type: String
    Default: helpdesk
  InstanceType:
    Type: String
    Default: t3.micro
  AmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64
  InstanceProfileName:
    Type: String
    Default: LabInstanceProfile
    Description: Profil d'instance fourni par AWS Academy (permet SSM, CloudWatch, S3)

Resources:
  FirstInstance:
    Type: AWS::EC2::Instance
    Properties:
      InstanceType: !Ref InstanceType
      ImageId: !Ref AmiId
      SubnetId: { "Fn::ImportValue": !Sub "${ProjectName}-PublicSubnetAId" }
      SecurityGroupIds:
        - { "Fn::ImportValue": !Sub "${ProjectName}-AppSgId" }
      IamInstanceProfile: !Ref InstanceProfileName
      MetadataOptions:
        HttpTokens: required
        HttpEndpoint: enabled
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs:
            VolumeType: gp3
            VolumeSize: 8
            Encrypted: true
            DeleteOnTermination: true
      Tags:
        - { Key: Name, Value: !Sub "${ProjectName}-app-1" }
        - { Key: Project, Value: !Ref ProjectName }
      UserData:
        Fn::Base64: |
          #!/bin/bash
          set -e
          dnf install -y nodejs
          mkdir -p /opt/helpdesk
          cat > /opt/helpdesk/server.js <<'JSEOF'
          const http = require("http");
          const IMDS = "http://169.254.169.254/latest/";
          async function imds(path) {
            const t = await (await fetch(IMDS + "api/token", {
              method: "PUT",
              headers: { "X-aws-ec2-metadata-token-ttl-seconds": "60" },
            })).text();
            return (await fetch(IMDS + "meta-data/" + path, {
              headers: { "X-aws-ec2-metadata-token": t },
            })).text();
          }
          http.createServer(async (req, res) => {
            if (req.url === "/health" || req.url === "/api/health") {
              res.writeHead(200, { "Content-Type": "application/json" });
              return res.end(JSON.stringify({ status: "ok" }));
            }
            const id = await imds("instance-id");
            const az = await imds("placement/availability-zone");
            res.writeHead(200, { "Content-Type": "text/plain" });
            res.end("HelpDesk Cloud - instance " + id + " (" + az + ")\n");
          }).listen(80);
          JSEOF
          cat > /etc/systemd/system/helpdesk.service <<'SVCEOF'
          [Unit]
          Description=HelpDesk Cloud backend
          After=network-online.target

          [Service]
          ExecStart=/usr/bin/node /opt/helpdesk/server.js
          Restart=always

          [Install]
          WantedBy=multi-user.target
          SVCEOF
          systemctl daemon-reload
          systemctl enable --now helpdesk

Outputs:
  InstanceId:
    Value: !Ref FirstInstance
  PublicIp:
    Value: !GetAtt FirstInstance.PublicIp
  AppUrl:
    Value: !Sub "http://${FirstInstance.PublicIp}/"
