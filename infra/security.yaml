AWSTemplateFormatVersion: "2010-09-09"
Description: HelpDesk Cloud L3 Security Groups

Parameters:
  ProjectName:
    Type: String
    Default: helpdesk
  AppPort:
    Type: Number
    Default: 80
  DemoCidr:
    Type: String
    Default: ""

Conditions:
  HasDemoCidr: !Not [!Equals [!Ref DemoCidr, ""]]

Resources:
  AlbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: ALB HTTP access
      VpcId: { "Fn::ImportValue": !Sub "${ProjectName}-VpcId" }
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
          Description: HTTP from Internet
      Tags:
        - { Key: Name, Value: !Sub "${ProjectName}-alb-sg" }
        - { Key: Project, Value: !Ref ProjectName }

  AppSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Application backend access
      VpcId: { "Fn::ImportValue": !Sub "${ProjectName}-VpcId" }
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: !Ref AppPort
          ToPort: !Ref AppPort
          SourceSecurityGroupId: !Ref AlbSecurityGroup
          Description: Application traffic from ALB
      Tags:
        - { Key: Name, Value: !Sub "${ProjectName}-app-sg" }
        - { Key: Project, Value: !Ref ProjectName }

  AppDemoIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Condition: HasDemoCidr
    Properties:
      GroupId: !Ref AppSecurityGroup
      IpProtocol: tcp
      FromPort: !Ref AppPort
      ToPort: !Ref AppPort
      CidrIp: !Ref DemoCidr
      Description: Temporary demo access

  RdsSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: PostgreSQL database access
      VpcId: { "Fn::ImportValue": !Sub "${ProjectName}-VpcId" }
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          SourceSecurityGroupId: !Ref AppSecurityGroup
          Description: PostgreSQL from application
      Tags:
        - { Key: Name, Value: !Sub "${ProjectName}-rds-sg" }
        - { Key: Project, Value: !Ref ProjectName }

Outputs:
  AlbSecurityGroupId:
    Value: !Ref AlbSecurityGroup
    Export: { Name: !Sub "${ProjectName}-AlbSgId" }
  AppSecurityGroupId:
    Value: !Ref AppSecurityGroup
    Export: { Name: !Sub "${ProjectName}-AppSgId" }
  RdsSecurityGroupId:
    Value: !Ref RdsSecurityGroup
    Export: { Name: !Sub "${ProjectName}-RdsSgId" }